version: '3.8'

services:
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    env_file:
      - .env  # Backend otomatis mendapat URI_MONGO, REDIS_HOST, dll

  frontend:
    build: ./frontend
    ports:
      - "8080:8080" # Sesuaikan port yang Anda inginkan
    env_file:
      - .env  # Frontend otomatis mendapat API_URL, APP_ENV, REDIS_HOST, dll
    depends_on:
      - backend