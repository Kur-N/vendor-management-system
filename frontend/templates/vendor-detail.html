        function loadBanks() {
            webix.ajax().headers({
                "Content-Type": "application/json",
            }).
            get("/get-bank").then(function (response) {
                const banks = response.json().data;
                const selectedBanks = vendorData.data.accountBank || []
                const checkboxBank = banks.map((bank) => ({
                    view:"checkbox",
                    id:`checkbox_${bank._id}`,
                    labelRight:bank._id,
                    name: bank._id,
                    value:selectedBanks.includes(bank._id)?1:0
                }));
                $$("bankCheckbox").addView({
                    rows:checkboxBank
                });
            }).catch(function (error) {
                webix.alert({
                    type:"alert-error",
                    title:"Error",
                    text:"Failed to load banks data"
                });
                console.log(error);
            });
        }

                            success: function (text,data,xhr) {

                                message = response.message;
                                webix.alert({
                                    title:"Tambah Cabang",
                                    text: message,
                                    callback: function () {
                                        location.reload();
                                    }

                            },

                $$("btnEditBranch").attachEvent("onItemClick", function () {
                    let selectedItem = $$("branchDatatable").getSelectedItem();
                    if (selectedItem) {
                        $$("editBranchWindow").show();
                        $$("editBranchForm").setValues(selectedItem,true);
                        // button edit
                        $$("btnEditBranch2").attachEvent("onItemClick", function () {
                            let values = $$("editBranchForm").getValues();
                            let message = "Isi Form sesuai dengan ketentuan";
                            if($$("editBranchForm").validate()){
                                webix.confirm({
                                    type:"alert-warning",
                                    title:"Edit Cabang",
                                    text: "Apakah Anda yakin ingin mengubah data cabang "+selectedItem.branchName+"?",
                                    callback: function (result) {
                                        if (result) {
                                            webix.ajax().headers({
                                                "Content-type":"application/json"
                                            }).put("/vendor-branch/"+vendorData.data._id, JSON.stringify(values),{
                                                success: function (text,data,xhr) {
                                                    const response = data.json();
                                                    message = response.message;
                                                    webix.alert({
                                                        title:"Tambah Cabang",
                                                        text: message,
                                                        callback: function () {
                                                            location.reload();
                                                        }
                                                    });
                                                },
                                                error: function (text,data,xhr) {
                                                    const response = data.json();
                                                    message = response.message;
                                                    webix.alert({
                                                        type:"alert-error",
                                                        title:"Tambah Cabang",
                                                        text: message
                                                    });
                                                }
                                            });
                                        }
                                    }
                                });
                            }else{
                                webix.message({
                                    type:"error",
                                    text:message
                                });
                            }
                        });
                    }else{
                        webix.message(
                            text="Silahkan pilih data Cabang dahulu"
                        );
                    }
                })

                // Vendor
                $$("btnEdit").attachEvent("onItemClick", function () {
                    webix.confirm({
                        type:"confirm-warning",
                        title:"Update Vendor",
                        text:"Apakah anda yakin untuk meng-edit data Vendor?",
                        ok:"Ya", cancel:"Tidak",
                        callback: function (result) {
                            if (result) {
                                const values = $$("vendorForm").getValues();
                                const selectedBank = getSelectedBank();
                                values.accountBank = selectedBank;
                                
                                let message = "Isi semua data Form!";
                                if ($$("vendorForm").validate()) {
                                    webix.ajax().headers({
                                        "Content-type":"application/json"
                                    }).put("/vendor/"+vendorData.data._id, JSON.stringify(values),{
                                        success: function (text,data,xhr) {
                                            let response = data.json()
                                            message = response.message;
                                            webix.alert({
                                                title:"Update Vendor",
                                                text:message,
                                                callback: function () {
                                                    location.reload();
                                                }
                                            });
                                        },
                                        error: function (text, data, xhr) {
                                            let response = data.json()
                                            message = response.message;
                                            webix.alert({
                                                type:"alert-error",
                                                title:"Update Vendor",
                                                text:message
                                            });
                                        }
                                    });
                                }else{
                                    webix.message({
                                        type:"error",
                                        text:message
                                    });
                                }
                            }
                        }
                    });
                    
                });

                // Equipment
                $$("btnAddEquipment").attachEvent("onItemClick", function () {
                    $$("equipmentWindow").show();
                    $$("btnTambahEquipment").show();
                    $$("btnEditEquipment2").hide();
                    $$("equipmentForm").clear();
                    $$("equipmentCodeForm").define("readonly",false);
                    $$("equipmentCodeForm").refresh();
                });
                $$("btnTambahEquipment").attachEvent("onItemClick", function () {
                    let values = $$("equipmentForm").getValues();
                    let message = "Isi Equipment Form sesuai ketentuan";
                    if($$("equipmentForm").validate()){
                        webix.ajax().headers({
                            "Content-type":"application/json"
                        }).post("/vendor-equipment/"+vendorData.data._id, JSON.stringify(values),{
                            success: function (text,data,xhr) {
                                const response = data.json();
                                message = response.message;
                                webix.alert({
                                    title:"Tambah Equipment",
                                    text: message,
                                    callback: function () {
                                        location.reload();
                                    }
                                });
                            },
                            error: function (text, data, xhr) {
                                const response = data.json();
                                message = response.message;
                                webix.alert({
                                    type:"alert-error",
                                    title:"Tambah Equipment",
                                    text: message
                                });
                            }
                        });
                    }else{
                        webix.message({
                            type:"error",
                            text:message
                        });
                    }
                });
                
                $$("btnEditEquipment").attachEvent("onItemClick", function () {
                     let selectedItem = $$("equipmentDatatable").getSelectedItem();
                     if(selectedItem){
                        $$("equipmentWindow").show();
                        $$("btnTambahEquipment").hide();
                        $$("btnEditEquipment2").show();
                        $$("equipmentForm").setValues(selectedItem,true);
                        $$("equipmentCodeForm").define("readonly",true);
                        $$("equipmentCodeForm").refresh();
                        $$("btnEditEquipment2").attachEvent("onItemClick", function () {
                            let values = $$("equipmentForm").getValues();
                            let message = "Isi Equipment Form sesuai ketentuan";
                            if($$("equipmentForm").validate()){
                                webix.confirm({
                                    type:"confirm-warning",
                                    title:"Edit Equipment",
                                    text: "Apakah anda yakin mengedit data equipment "+selectedItem.equipmentCode+"?",
                                    ok:"Ya", cancel:"Tidak",
                                    callback: function (result) {
                                        if (result) {
                                            webix.ajax().headers({
                                                "Content-Type": "application/json"
                                            }).put("/vendor-equipment/"+vendorData.data._id, JSON.stringify(values),{
                                                success: function (text,data,xhr) {
                                                    const response = data.json();
                                                    message = response.message;
                                                    webix.alert({
                                                        title:"Edit Equipment",
                                                        text: message,
                                                        callback: function () {
                                                            location.reload();
                                                        }
                                                    });
                                                },
                                                error: function (text,data,xhr) {
                                                    const response = data.json();
                                                    message = response.message;
                                                    webix.alert({
                                                        type:"alert-error",
                                                        title:"Edit Equipment",
                                                        text: message
                                                    });
                                                }
                                            });
                                        }
                                    }
                                })
                            }else{
                                webix.message({
                                    type:"error",
                                    text:message
                                });
                            }
                        });
                     }else{
                        webix.message(
                            text="Silahkan pilih data Equipment dahulu"
                        );
                     }
                });
                
                $$("btnDeleteEquipment").attachEvent("onItemClick", function () {
                     let selectedItem = $$("equipmentDatatable").getSelectedItem();
                     if(selectedItem){
                        webix.confirm({
                            type:"confirm-error",
                            title:"Delete Equipment",
                            text: "Apakah Anda yakin ingin menghapus data Equipment "+selectedItem.equipmentCode+"?",
                            ok:"Ya", cancel:"Tidak",
                            callback: function (result) {
                                if (result) {
                                    webix.ajax().headers({
                                        "Content-type":"application/json"
                                    }).del("/vendor-equipment/"+vendorData.data._id, 
                                    JSON.stringify({equipmentCode:selectedItem.equipmentCode}))
                                    .then(function (response) {
                                        response = response.json();
                                        webix.alert({
                                            title:"Hapus Equipment",
                                            text:response.message,
                                            callback: function(){
                                                location.reload();
                                            }
                                        });
                                    })
                                    .fail(function (response) {
                                        response = response.json();
                                        webix.alert({
                                            type:"alert-error",
                                            title:"Hapus Cabang",
                                            text:response.message
                                        });
                                    });
                                }
                            }
                        });
                     }else{
                        webix.message(
                            text="Silahkan pilih data Equipment dahulu"
                        );
                     }
                });

            });//webix ready

            webix.ready(function () {
                webix.ajax().get("/session")
                .then(function(response) {
                    appState.session = response.json();
                    appState.username = appState.session.data.username;
                    appState.role = appState.session.data.role;
                    if (appState.role == "admin") {
                        // admin
                        $$("vendorChange").show();
                        $$("btnEdit").show();
                        $$("bankCheckbox").enable();
                        $$("partnerType").define("readonly",false);
                        $$("vendorName").define("readonly",false);
                        $$("unitUsaha").define("readonly",false);
                        $$("address").define("readonly",false);
                        $$("country").define("readonly",false);
                        $$("province").define("readonly",false);
                        $$("noTelp").define("readonly",false);
                        $$("emailCompany").define("readonly",false);
                        $$("namePIC").define("readonly",false);
                        $$("emailPIC").define("readonly",false);
                        $$("positionPIC").define("readonly",false);
                        $$("activeStatus").enable();
                        // refresh
                        $$("partnerType").refresh();
                        $$("vendorName").refresh();
                        $$("unitUsaha").refresh();
                        $$("address").refresh();
                        $$("country").refresh();
                        $$("province").refresh();
                        $$("noTelp").refresh();
                        $$("emailCompany").refresh();
                        $$("namePIC").refresh();
                        $$("emailPIC").refresh();
                        $$("positionPIC").refresh();
                        $$("addBranchForm").enable();
                        $$("editBranchForm").enable();
                        $$("equipmentForm").enable();
                        $$("btnAddBranch").show();
                        $$("btnEditBranch").show();
                        $$("btnAddEquipment").show();
                        $$("btnEditEquipment").show();
                        $$("btnDeleteEquipment").show();

                        $$("mySidebar").filter(function (obj) {
                            return obj.id == obj.id;
                        });
                    }
                }).catch(function (error) {
                    console.log("Gagal mendapatkan data", error);
                });
            });
        </script>
